name: React Node CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t health-app .

      - name: Test Docker Container
        run: |
          docker run -d --name health -p 3000:80 health-app
          sleep 5
          curl --fail http://localhost:3000

      - name: Cleanup
        if: always()
        run: |
          docker stop health || true
          docker rm health || true

      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/key.pem"
          chmod 600 "$HOME/.ssh/key.pem"

          ssh -i "$HOME/.ssh/key.pem" \
            -o StrictHostKeyChecking=no \
            "$EC2_USER@$EC2_HOST" '
              set -e
              cd /home/ubuntu/Health
              git pull origin main
              sudo docker build -t health-app .
              sudo docker rm -f health || true
              sudo docker run -d \
                --name health \
                -p 3000:80 \
                --restart unless-stopped \
                health-app
            '