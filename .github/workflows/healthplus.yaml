
name: React Node CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t react-node-app .

      - name: Run Container
        run: docker run -d --name react-node-app -p 3000:80 react-node-app

      - name: Test Application
        run: |
          sleep 5
          curl --fail http://localhost:3000

      - name: Cleanup
        if: always()
        run: |
          docker stop react-node-app || true
          docker rm react-node-app || true

      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem

          ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "cd /opt/react-node-app && git pull && docker build -t react-node-app . && docker rm -f react-node-app || true; docker run -d --name react-node-app -p 3000:80 react-node-app"
